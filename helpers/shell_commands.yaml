# Vision AI — Shell Commands
# Reference file for shell_command entries required by the vision AI system.
# Deploy these to HAOS configuration.yaml under the shell_command: key.
# Requires HA restart after adding (YAML shell_commands cannot be reloaded).
#
# Paths below are EXAMPLES — replace YOUR_MEDIA_MOUNT with your media path.
# Camera names (driveway, backyard) are EXAMPLES — rename to match your cameras.

# --- Snapshot Cleanup ---
# Called by vision_cleanup_old_snapshots automation (daily 3 AM).
# Local HAOS: short retention (disk limited).
# Optional media mount: longer retention.
# Preserves _latest.jpg, _baseline.jpg, _prior.jpg (overwritten in place).
cleanup_old_snapshots: >-
  find /config/www/snapshots/ -name "*.jpg" -mtime +7 -delete;
  find /media/YOUR_MEDIA_MOUNT/vision_ai/snapshots/ -name "*.jpg"
  ! -name "*_latest.jpg"
  ! -name "*_baseline.jpg"
  ! -name "*_prior.jpg"
  -mtime +365 -delete

# --- Prior Image Copy (per-camera, static paths) ---
# Called by main automation before overwriting _latest.jpg on each detection.
# Copies current latest → prior so the AI can compare sequential detections.
# shell_command does not support Jinja templates, so one entry per camera.
# Fails silently (|| true) if _latest.jpg doesn't exist yet (first run).
# EXAMPLE camera IDs — rename to match your cameras.
vision_copy_prior_driveway: "cp /media/YOUR_MEDIA_MOUNT/vision_ai/snapshots/driveway_latest.jpg /media/YOUR_MEDIA_MOUNT/vision_ai/snapshots/driveway_prior.jpg 2>/dev/null || true"
vision_copy_prior_backyard: "cp /media/YOUR_MEDIA_MOUNT/vision_ai/snapshots/backyard_latest.jpg /media/YOUR_MEDIA_MOUNT/vision_ai/snapshots/backyard_prior.jpg 2>/dev/null || true"
