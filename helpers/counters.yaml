# Vision AI — Daily Detection Counters (EXAMPLE)
# Add to configuration.yaml under `counter:`
# Reset daily by vision_reset_daily_detection_counters automation (midnight)
#
# IMPORTANT: Keys below are EXAMPLES. Rename to match your cameras before deploying.

# Global totals
people_detected_today:
  name: People Detected Today
  initial: 0
  step: 1
  icon: mdi:account-multiple

vehicles_detected_today:
  name: Vehicles Detected Today
  initial: 0
  step: 1
  icon: mdi:car-multiple

animals_detected_today:
  name: Animals Detected Today
  initial: 0
  step: 1
  icon: mdi:paw

