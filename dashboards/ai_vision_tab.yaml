# Vision AI — AI Vision Dashboard Tab (EXAMPLE)
# This is a HA dashboard view (sections layout).
# Add as a view in your Lovelace dashboard configuration.
#
# EXAMPLE entities below (driveway, backyard, front_yard, garage, front_door,
# indoor_a, indoor_b) illustrate a multi-camera layout — rename to match your helpers.
#
# Requires: counters, input_numbers, input_texts, and automations adapted from this repo.
# Optional: sensor.ai_conversation_cost_estimate (template sensor for AI cost tracking)

- type: sections
  title: AI Vision
  path: ai-vision
  icon: mdi:brain
  badges:
  - entity: counter.people_detected_today
    name: People Today
  - entity: counter.vehicles_detected_today
    name: Vehicles Today
  - entity: counter.animals_detected_today
    name: Animals Today
  sections:
  - type: grid
    title: ''
    cards:
    - type: heading
      heading: Global Detections (Today)
      heading_style: title
      icon: mdi:brain
    - type: glance
      title: Detection Totals
      show_name: true
      show_state: true
      columns: 3
      entities:
      - entity: counter.people_detected_today
        name: People
        icon: mdi:account-group
      - entity: counter.vehicles_detected_today
        name: Vehicles
        icon: mdi:car
      - entity: counter.animals_detected_today
        name: Animals
        icon: mdi:paw
  - type: grid
    title: ''
    cards:
    - type: heading
      heading: Daily Detections by Camera (EXAMPLES)
      heading_style: title
      icon: mdi:counter
    - type: glance
      title: Per-Camera People (Today)
      show_name: true
      show_state: true
      columns: 4
      entities:
      - entity: counter.driveway_people_today
        name: driveway
      - entity: counter.backyard_people_today
        name: backyard
      - entity: counter.front_yard_people_today
        name: front_yard
      - entity: counter.garage_people_today
        name: garage
      - entity: counter.front_door_people_today
        name: front_door
      - entity: counter.indoor_a_people_today
        name: indoor_a
      - entity: counter.indoor_b_people_today
        name: indoor_b
    - type: glance
      title: Per-Camera Vehicles & Animals (Today)
      show_name: true
      show_state: true
      columns: 4
      entities:
      - entity: counter.driveway_vehicles_today
        name: driveway Vehicles
      - entity: counter.driveway_animals_today
        name: driveway Animals
      - entity: counter.backyard_vehicles_today
        name: backyard Vehicles
      - entity: counter.backyard_animals_today
        name: backyard Animals
      - entity: counter.front_yard_vehicles_today
        name: front_yard Vehicles
      - entity: counter.front_yard_animals_today
        name: front_yard Animals
      - entity: counter.garage_vehicles_today
        name: garage Vehicles
      - entity: counter.garage_animals_today
        name: garage Animals
  - type: grid
    title: ''
    cards:
    - type: heading
      heading: Live Scene
      heading_style: title
      icon: mdi:eye
    - type: glance
      title: Outdoor (Live) — EXAMPLE
      show_name: true
      show_state: true
      columns: 3
      entities:
      - entity: input_number.driveway_people_live
        name: driveway People
        icon: mdi:account
      - entity: input_number.driveway_vehicles_live
        name: driveway Vehicles
        icon: mdi:car
      - entity: input_number.driveway_animals_live
        name: driveway Animals
        icon: mdi:paw
      - entity: input_number.backyard_people_live
        name: backyard People
        icon: mdi:account
      - entity: input_number.backyard_vehicles_live
        name: backyard Vehicles
        icon: mdi:car
      - entity: input_number.backyard_animals_live
        name: backyard Animals
        icon: mdi:paw
    - type: glance
      title: Other Cameras (Live) — EXAMPLE
      show_name: true
      show_state: true
      columns: 3
      entities:
      - entity: input_number.front_yard_people_live
        name: front_yard People
        icon: mdi:account
      - entity: input_number.garage_people_live
        name: garage People
        icon: mdi:account
      - entity: input_number.front_door_people_live
        name: front_door People
        icon: mdi:account
      - entity: input_number.indoor_a_people_live
        name: indoor_a People
        icon: mdi:account
      - entity: input_number.indoor_b_people_live
        name: indoor_b People
        icon: mdi:account
  - type: grid
    title: ''
    cards:
    - type: heading
      heading: Last AI Analysis
      heading_style: title
      icon: mdi:text-box-search
    - type: entities
      title: Outdoor Cameras (EXAMPLE)
      show_header_toggle: false
      entities:
      - entity: input_text.vision_last_driveway
        name: driveway
        icon: mdi:brain
      - entity: input_text.vision_last_type_driveway
        name: ""
        icon: mdi:tag
      - entity: input_text.vision_last_backyard
        name: backyard
        icon: mdi:brain
      - entity: input_text.vision_last_type_backyard
        name: ""
        icon: mdi:tag
      - entity: input_text.vision_last_front_yard
        name: front_yard
        icon: mdi:brain
      - entity: input_text.vision_last_type_front_yard
        name: ""
        icon: mdi:tag
    - type: entities
      title: Other Cameras (EXAMPLE)
      show_header_toggle: false
      entities:
      - entity: input_text.vision_last_front_door
        name: front_door
        icon: mdi:brain
      - entity: input_text.vision_last_type_front_door
        name: ""
        icon: mdi:tag
      - entity: input_text.vision_last_garage
        name: garage
        icon: mdi:brain
      - entity: input_text.vision_last_type_garage
        name: ""
        icon: mdi:tag
      - entity: input_text.vision_last_indoor_a
        name: indoor_a
        icon: mdi:brain
      - entity: input_text.vision_last_type_indoor_a
        name: ""
        icon: mdi:tag
      - entity: input_text.vision_last_indoor_b
        name: indoor_b
        icon: mdi:brain
      - entity: input_text.vision_last_type_indoor_b
        name: ""
        icon: mdi:tag
  - type: grid
    title: ''
    cards:
    - type: heading
      heading: AI Automations
      heading_style: title
      icon: mdi:robot
    - type: entities
      title: Vision AI Automations
      entities:
      - entity: automation.vision_ai_camera_analysis_on_detection
        name: AI Camera Analysis
        secondary_info: last-triggered
      - entity: automation.vision_live_scene_tracker
        name: Live Scene Tracker
        secondary_info: last-triggered
      - entity: automation.vision_reset_daily_detection_counters
        name: Daily Counter Reset
        secondary_info: last-triggered
      - entity: automation.vision_cleanup_old_snapshots
        name: Snapshot Cleanup (daily 3AM)
        secondary_info: last-triggered
  - type: grid
    title: ''
    cards:
    - type: heading
      heading: AI Cost Tracking
      heading_style: title
      icon: mdi:cash-multiple
    - type: entities
      title: AI Usage & Costs (optional sensors)
      entities:
      - entity: sensor.ai_conversation_cost_estimate
        name: Total AI Cost
        icon: mdi:cash-multiple
