# Vision AI — AI Camera Analysis on Detection (EXAMPLE TEMPLATE)
# Rename EXAMPLE entity IDs, YOUR_* paths/hosts, notify/TTS targets before deploying.
# Snapshot-capable cameras: binary_sensor triggers + optional temporal comparison.
# Event cameras: event.* triggers, single-image analysis.
# Paths: /media/YOUR_MEDIA_MOUNT/vision_ai/ — Dashboard: https://YOUR_VISION_HOST/
# Add vision_dashboard_token to secrets.yaml if using tokenized dashboard URLs.

alias: "Vision: AI Camera Analysis on Detection"
description: >-
  EXAMPLE template: on detection, analyze camera frames with AI, save snapshots,
  update counters/helpers, notify, and optional TTS. Adapt cameras and targets.
mode: single
max_exceeded: silent

triggers:
  - trigger: state
    id: snapshot_camera
    entity_id:
      - binary_sensor.driveway_person
      - binary_sensor.driveway_vehicle
      - binary_sensor.driveway_animal
      - binary_sensor.driveway_motion
      - binary_sensor.backyard_person
      - binary_sensor.backyard_vehicle
      - binary_sensor.backyard_animal
      - binary_sensor.backyard_motion
    to: "on"
    for:
      seconds: 1
  - trigger: state
    id: event_camera
    entity_id:
      - event.front_door_motion
      - event.front_door_chime
      - event.front_yard_motion
      - event.garage_motion
      - event.indoor_a_motion
      - event.indoor_b_motion
    not_from:
      - "unknown"
      - "unavailable"

conditions:
  - condition: state
    entity_id: input_boolean.notifications_enabled
    state: "on"

actions:
  - variables:
      vision_dashboard_token: !secret vision_dashboard_token
  - variables:
      det_type: >-
        {% set parts = trigger.entity_id.split('.')[-1].split('_') %}
        {% set valid = ['person','animal','vehicle','motion','chime','sound'] %}
        {% if trigger.id == 'event_camera' and trigger.to_state is defined %}
          {% set raw = trigger.to_state.attributes.get('event_type', 'motion')
                       | replace('camera_', '') | replace('doorbell_', '') | trim %}
        {% else %}
          {% set raw = parts[-1] | trim %}
        {% endif %}
        {{ raw if raw in valid else 'motion' }}
      area: >-
        {% set parts = trigger.entity_id.split('.')[-1].split('_') %}
        {% set valid = ['person','animal','vehicle','motion','chime','sound'] %}
        {% set area_parts = parts[:-1] | reject('eq', 'camera') | reject('in', valid) | list %}
        {{ ' '.join(area_parts) | title }}
      display_area: "{{ area }}"
      camera_entity: >-
        {% set parts = trigger.entity_id.split('.')[-1].split('_') %}
        {% set key = '_'.join(parts[:-1]) %}
        {% set m = {
          'front_door':'camera.front_door','front_yard':'camera.front_yard',
          'garage':'camera.garage','indoor_a':'camera.indoor_a','indoor_b':'camera.indoor_b',
          'driveway':'camera.driveway','backyard':'camera.backyard'} %}
        {{ m[key] if key in m else 'camera.' ~ key }}
      camera_name: "{{ camera_entity | replace('camera.', '') }}"
      title: "{{ display_area }} {{ det_type | title }} Alert!"
      tts_message: >-
        {% if camera_entity == 'camera.front_door' and det_type == 'chime' %}
          Someone is at the front door!
        {% else %}
          {{ 'An' if det_type[0] | lower in 'aeiou' else 'A' }} {{ det_type }} was detected in the {{ display_area }}!
        {% endif %}
      ai_prompt: >-
        Start your description directly with what you observe. A {{ det_type }} was detected.
        Describe the scene in 2-3 sentences. State exact counts of people, vehicles, and animals.
        Be factual and concise. Do not speculate.
      suppress_notification: "{{ display_area in ['Indoor A'] }}"
      is_snapshot_camera: "{{ trigger.id == 'snapshot_camera' }}"
      snap_ts: "{{ now().strftime('%Y%m%d_%H%M%S') }}"
      ai_label: "AI"
      notification_color: >-
        {% if det_type == 'person' %}#FF0000{% elif det_type == 'vehicle' %}#2196F3{% elif det_type == 'animal' %}#4CAF50{% elif det_type == 'chime' %}#FF9800{% else %}#FFC107{% endif %}
      notification_icon_name: >-
        {% if det_type == 'person' %}mdi:account{% elif det_type == 'vehicle' %}mdi:car{% elif det_type == 'animal' %}mdi:paw{% elif det_type == 'chime' %}mdi:bell-ring{% else %}mdi:motion-sensor{% endif %}
      notification_channel: >-
        {% if det_type == 'person' %}Person Alert{% elif det_type == 'vehicle' %}Vehicle Alert{% elif det_type == 'animal' %}Animal Alert{% elif det_type == 'chime' %}Doorbell{% else %}Motion{% endif %}

  - variables:
      has_baseline: >-
        {{ is_snapshot_camera and states('input_datetime.vision_last_baseline_' ~ camera_name) not in ['unknown', 'unavailable'] }}
      has_prior: >-
        {{ is_snapshot_camera and states('input_datetime.vision_last_detection_' ~ camera_name) not in ['unknown', 'unavailable'] }}
      use_temporal: "{{ has_baseline | bool(false) }}"
      fov_context: >-
        {% set fov = {
          'driveway': 'Faces the driveway. Report activity on property only — ignore street traffic.',
          'backyard': 'Faces the backyard. All frame activity is on the property.',
          'front_door': 'Faces the front porch/entry.',
          'front_yard': 'Faces the front yard. Prefer lawn/walkway over street traffic.',
          'garage': 'Monitors the garage / package area.',
          'indoor_a': 'Indoor area.',
          'indoor_b': 'Indoor area.'
        } %}
        {{ fov.get(camera_name, '') }}
      ai_prompt_temporal: >-
        Analyze security images for NEW activity only. {{ fov_context }}
        Compare current frame to baseline{% if has_prior | bool(false) %} and prior{% endif %}.
        Ignore objects already present. Set is_new_activity false if unchanged.
        A {{ det_type }} detection was triggered. Be factual in 2-3 sentences with counts.

  - choose:
      - conditions:
          - "{{ use_temporal and has_prior | bool(false) }}"
        sequence:
          - action: ai_task.generate_data
            response_variable: result
            continue_on_error: true
            data:
              entity_id: ai_task.google_ai_task
              task_name: "{{ display_area | trim }} camera analysis (temporal)"
              instructions: "{{ ai_prompt_temporal }}"
              structure:
                analysis:
                  selector:
                    text: {}
                people_count:
                  selector:
                    number: {}
                vehicle_count:
                  selector:
                    number: {}
                animal_count:
                  selector:
                    number: {}
                detected_objects:
                  selector:
                    text: {}
                is_new_activity:
                  selector:
                    boolean: {}
                change_summary:
                  selector:
                    text: {}
              attachments:
                - media_content_id: "media-source://media_source/local/YOUR_MEDIA_MOUNT/vision_ai/snapshots/{{ camera_name }}_baseline.jpg"
                  media_content_type: image/jpeg
                - media_content_id: "media-source://media_source/local/YOUR_MEDIA_MOUNT/vision_ai/snapshots/{{ camera_name }}_prior.jpg"
                  media_content_type: image/jpeg
                - media_content_id: "media-source://camera/{{ camera_entity | trim }}"
                  media_content_type: image/jpeg
      - conditions:
          - "{{ use_temporal }}"
        sequence:
          - action: ai_task.generate_data
            response_variable: result
            continue_on_error: true
            data:
              entity_id: ai_task.google_ai_task
              task_name: "{{ display_area | trim }} camera analysis (temporal)"
              instructions: "{{ ai_prompt_temporal }}"
              structure:
                analysis:
                  selector:
                    text: {}
                people_count:
                  selector:
                    number: {}
                vehicle_count:
                  selector:
                    number: {}
                animal_count:
                  selector:
                    number: {}
                detected_objects:
                  selector:
                    text: {}
                is_new_activity:
                  selector:
                    boolean: {}
                change_summary:
                  selector:
                    text: {}
              attachments:
                - media_content_id: "media-source://media_source/local/YOUR_MEDIA_MOUNT/vision_ai/snapshots/{{ camera_name }}_baseline.jpg"
                  media_content_type: image/jpeg
                - media_content_id: "media-source://camera/{{ camera_entity | trim }}"
                  media_content_type: image/jpeg
    default:
      - action: ai_task.generate_data
        response_variable: result
        continue_on_error: true
        data:
          entity_id: ai_task.google_ai_task
          task_name: "{{ display_area | trim }} camera analysis"
          instructions: "{{ ai_prompt }}"
          structure:
            analysis:
              selector:
                text: {}
            people_count:
              selector:
                number: {}
            vehicle_count:
              selector:
                number: {}
            animal_count:
              selector:
                number: {}
            detected_objects:
              selector:
                text: {}
            is_new_activity:
              selector:
                boolean: {}
            change_summary:
              selector:
                text: {}
          attachments:
            - media_content_id: "media-source://camera/{{ camera_entity | trim }}"
              media_content_type: image/jpeg

  - variables:
      analysis_text: >-
        {{ result.data.analysis | default(result.response_text, true) | default(result.response, true) | default('Analysis unavailable.') | replace('*','') | trim }}
      people_count: "{{ result.data.people_count | default(0, true) | int(0) }}"
      vehicle_count: "{{ result.data.vehicle_count | default(0, true) | int(0) }}"
      animal_count: "{{ result.data.animal_count | default(0, true) | int(0) }}"
      detected_objects: "{{ result.data.detected_objects | default('none', true) | string | trim }}"
      is_new_activity: "{{ result.data.is_new_activity | default(true, true) }}"
      change_summary: "{{ result.data.change_summary | default('', true) | trim }}"
      area_key: "{{ camera_name | lower | replace(' ', '_') }}"

  - if:
      - "{{ is_snapshot_camera }}"
    then:
      - action: "shell_command.vision_copy_prior_{{ camera_name }}"
        continue_on_error: true
      - action: camera.snapshot
        target:
          entity_id: "{{ camera_entity | trim }}"
        data:
          filename: "/media/YOUR_MEDIA_MOUNT/vision_ai/snapshots/{{ camera_name }}_{{ snap_ts }}.jpg"
      - action: camera.snapshot
        target:
          entity_id: "{{ camera_entity | trim }}"
        data:
          filename: "/media/YOUR_MEDIA_MOUNT/vision_ai/snapshots/{{ camera_name }}_latest.jpg"
      - action: camera.snapshot
        target:
          entity_id: "{{ camera_entity | trim }}"
        data:
          filename: "/config/www/snapshots/{{ camera_name }}_{{ snap_ts }}.jpg"
      - action: input_datetime.set_datetime
        target:
          entity_id: "input_datetime.vision_last_detection_{{ camera_name }}"
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        continue_on_error: true

  - event: vision_detection
    event_data:
      area: "{{ display_area }}"
      camera: "{{ camera_entity | trim }}"
      camera_name: "{{ camera_name }}"
      det_type: "{{ det_type }}"
      people_count: "{{ people_count }}"
      vehicle_count: "{{ vehicle_count }}"
      animal_count: "{{ animal_count }}"
      detected_objects: "{{ detected_objects }}"
      analysis: "{{ analysis_text }}"
      is_new_activity: "{{ is_new_activity }}"
      change_summary: "{{ change_summary }}"
      timestamp: "{{ now().isoformat() }}"
      snapshot: "{{ camera_name }}_{{ snap_ts }}.jpg"

  - action: vision_ai.record_detection
    data:
      timestamp: "{{ now().isoformat() }}"
      camera: "{{ camera_entity | trim }}"
      area: "{{ display_area }}"
      det_type: "{{ det_type }}"
      people_count: "{{ people_count }}"
      vehicle_count: "{{ vehicle_count }}"
      animal_count: "{{ animal_count }}"
      detected_objects: "{{ detected_objects }}"
      analysis_text: "{{ analysis_text }}"
      snapshot_path: "{{ camera_name }}_{{ snap_ts }}.jpg"
    continue_on_error: true

  - action: counter.increment
    target:
      entity_id: counter.gemini_requests_today
    continue_on_error: true

  - action: input_text.set_value
    target:
      entity_id: "input_text.vision_last_{{ area_key }}"
    data:
      value: "{{ analysis_text[:255] }}"
    continue_on_error: true
  - action: input_text.set_value
    target:
      entity_id: "input_text.vision_last_type_{{ area_key }}"
    data:
      value: "{{ det_type | title }} — {{ now().strftime('%H:%M:%S') }}"
    continue_on_error: true

  - if:
      - "{{ people_count | int(0) > 0 }}"
    then:
      - action: counter.increment
        target:
          entity_id: counter.people_detected_today
      - action: counter.increment
        target:
          entity_id: "counter.{{ area_key }}_people_today"
        continue_on_error: true
  - if:
      - "{{ vehicle_count | int(0) > 0 }}"
    then:
      - action: counter.increment
        target:
          entity_id: counter.vehicles_detected_today
      - if:
          - "{{ has_value('counter.' ~ area_key ~ '_vehicles_today') }}"
        then:
          - action: counter.increment
            target:
              entity_id: "counter.{{ area_key }}_vehicles_today"
  - if:
      - "{{ animal_count | int(0) > 0 }}"
    then:
      - action: counter.increment
        target:
          entity_id: counter.animals_detected_today
      - if:
          - "{{ has_value('counter.' ~ area_key ~ '_animals_today') }}"
        then:
          - action: counter.increment
            target:
              entity_id: "counter.{{ area_key }}_animals_today"

  - if:
      - "{{ not suppress_notification }}"
      - "{{ is_new_activity | bool(true) }}"
    then:
      - action: notify.notify
        data:
          title: "{{ title }}"
          message: >-
            {% if change_summary %}NEW: {{ change_summary }} — {{ ai_label }}: {{ analysis_text }}{% else %}{{ ai_label }}: {{ analysis_text }}{% endif %}
          data:
            ttl: 0
            priority: high
            sticky: "true"
            channel: "{{ notification_channel | trim }}"
            group: "vision_alerts"
            notification_icon: "{{ notification_icon_name | trim }}"
            color: "{{ notification_color | trim }}"
            image: "{% if is_snapshot_camera %}/local/snapshots/{{ camera_name }}_{{ snap_ts }}.jpg{% endif %}"
            tag: "vision_{{ camera_name }}"
            clickAction: "entityId:{{ camera_entity | trim }}"
            alert_once: true
            timeout: "{{ 300 if det_type == 'motion' else 600 }}"
            actions:
              - action: URI
                title: "Live View"
                uri: "https://YOUR_VISION_HOST/stream/{{ camera_name }}?token={{ vision_dashboard_token }}"
              - action: URI
                title: "Gallery"
                uri: "https://YOUR_VISION_HOST/cameras?camera={{ camera_name }}&view=detections&token={{ vision_dashboard_token }}"
      - action: persistent_notification.create
        data:
          title: "{{ title }}"
          message: >-
            {{ ai_label }}: {{ analysis_text }}
            {% if is_snapshot_camera %}![snapshot](/local/snapshots/{{ camera_name }}_{{ snap_ts }}.jpg){% endif %}

  - if:
      - "{{ not suppress_notification }}"
      - "{{ is_new_activity | bool(true) }}"
      - "{{ det_type == 'chime' or states('timer.tts_vision_cooldown') != 'active' }}"
    then:
      - action: tts.speak
        target:
          entity_id: tts.YOUR_TTS_ENGINE
        data:
          media_player_entity_id:
            - media_player.tts_satellite
          message: "{{ tts_message }}"
      - if:
          - "{{ det_type != 'chime' }}"
        then:
          - action: timer.start
            target:
              entity_id: timer.tts_vision_cooldown
            data:
              duration: "00:03:00"

  - delay:
      seconds: 30
