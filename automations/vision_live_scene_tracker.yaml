id: vision_live_scene_tracker
alias: 'Vision: Live Scene Tracker'
description: Generalized live scene poller. On vision_detection event with objects present, re-polls the camera every 60s
  via AI to count all people, vehicles, and animals. Updates per-area live sensors (input_number). Fires vision_live_update
  events for downstream consumers (catalog, queue, dashboard). Stops when scene is empty or after 10 minutes. All counts use
  Gemini free tier (zero cost).
triggers:
- trigger: event
  event_type: vision_detection
conditions:
- condition: template
  value_template: "{{ (trigger.event.data.people_count | int(0) +\n    trigger.event.data.vehicle_count | int(0) +\n    trigger.event.data.animal_count\
    \ | int(0)) > 0 }}"
actions:
- variables:
    area_key: '{{ trigger.event.data.area | lower | replace('' '', ''_'') }}'
    camera: '{{ trigger.event.data.camera }}'
    area_name: '{{ trigger.event.data.area }}'
- action: input_number.set_value
  target:
    entity_id: input_number.{{ area_key }}_people_live
  data:
    value: '{{ trigger.event.data.people_count | int(0) }}'
- action: input_number.set_value
  target:
    entity_id: input_number.{{ area_key }}_vehicles_live
  data:
    value: '{{ trigger.event.data.vehicle_count | int(0) }}'
- action: input_number.set_value
  target:
    entity_id: input_number.{{ area_key }}_animals_live
  data:
    value: '{{ trigger.event.data.animal_count | int(0) }}'
- repeat:
    count: 10
    sequence:
    - delay:
        seconds: 60
    - action: ai_task.generate_data
      response_variable: recheck
      data:
        entity_id: ai_task.google_ai_task
        task_name: Live scene check {{ area_name }}
        instructions: Count all objects currently visible in this security camera image. Return the count of people, vehicles,
          and animals separately. If a type is not visible, return 0. For detected_objects, list each distinct object (e.g.,
          "2 people, 1 silver SUV, 3 birds").
        structure:
          people_count:
            selector:
              number: {}
          vehicle_count:
            selector:
              number: {}
          animal_count:
            selector:
              number: {}
          detected_objects:
            selector:
              text: {}
        attachments:
        - media_content_id: media-source://camera/{{ camera }}
          media_content_type: image/jpeg
    - action: input_number.set_value
      target:
        entity_id: input_number.{{ area_key }}_people_live
      data:
        value: '{{ recheck.data.people_count | default(0) | int(0) }}'
    - action: input_number.set_value
      target:
        entity_id: input_number.{{ area_key }}_vehicles_live
      data:
        value: '{{ recheck.data.vehicle_count | default(0) | int(0) }}'
    - action: input_number.set_value
      target:
        entity_id: input_number.{{ area_key }}_animals_live
      data:
        value: '{{ recheck.data.animal_count | default(0) | int(0) }}'
    - event: vision_live_update
      event_data:
        area: '{{ area_name }}'
        camera: '{{ camera }}'
        people_count: '{{ recheck.data.people_count | default(0) }}'
        vehicle_count: '{{ recheck.data.vehicle_count | default(0) }}'
        animal_count: '{{ recheck.data.animal_count | default(0) }}'
        detected_objects: '{{ recheck.data.detected_objects | default('''') }}'
        timestamp: '{{ now().isoformat() }}'
        poll_iteration: '{{ repeat.index }}'
    - condition: template
      value_template: "{{ (recheck.data.people_count | int(0) +\n    recheck.data.vehicle_count | int(0) +\n    recheck.data.animal_count\
        \ | int(0)) > 0 }}"
- action: input_number.set_value
  target:
    entity_id:
    - input_number.{{ area_key }}_people_live
    - input_number.{{ area_key }}_vehicles_live
    - input_number.{{ area_key }}_animals_live
  data:
    value: 0
mode: parallel
max: 7
